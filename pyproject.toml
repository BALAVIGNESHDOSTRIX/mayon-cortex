[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mayon-cortex"
version = "1.0.0"
description = "A biologically-inspired, neuro-symbolic cognitive architecture operating on pure CPU with zero GPU, zero backprop, and 100% deterministic reasoning."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "AGPL-3.0-or-later OR Commercial"}
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
authors = [
    {name = "BALAVIGNESH M", email = "balavignesh@infidos.com"},
    {name = "INFIDOS LLP", email = "contact@infidos.com"}
]
dependencies = [
    "numpy>=1.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov",
    "black",
    "isort",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["mayon_cortex*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
